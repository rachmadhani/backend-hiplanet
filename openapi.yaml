openapi: 3.0.3
info:
  title: Hi Planet API
  description: API documentation for the Hi Planet Backend, including User Authentication and Tester Applications.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Local development server
paths:
  /auth/register:
    post:
      summary: Register a new user
      description: Create a new administrator/team member account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  example: adminuser
                email:
                  type: string
                  format: email
                  example: admin@hiplanet.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User registered successfully
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Validation error or duplicate username/email
  /auth/login:
    post:
      summary: Log in a user
      description: Authenticate credentials (email or username) and retrieve a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                  description: Email or Username
                  example: admin@hiplanet.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Invalid credentials
  /users:
    get:
      summary: Get all users
      description: Retrieve a list of registered team members. Protected by JWT.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User list fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
    post:
      summary: Create a user
      description: Create a user from admin panel. Protected by JWT.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  example: testuser
                email:
                  type: string
                  format: email
                  example: test@hiplanet.com
                password:
                  type: string
                  format: password
                  example: testpassword123
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User created successfully
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /tester-applications:
    post:
      summary: Submit a tester application
      description: Public endpoint for potential testers to submit applications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
                - platform
                - why
                - nda
              properties:
                email:
                  type: string
                  format: email
                  example: tester@example.com
                name:
                  type: string
                  example: SuperPlayer
                platform:
                  type: string
                  enum: [Windows, macOS, Both]
                  example: Windows
                why:
                  type: string
                  example: I have played 500 hours of horde-roguelite games.
                country:
                  type: string
                  example: South Korea
                nda:
                  type: boolean
                  example: true
      responses:
        '201':
          description: Application submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Application submitted successfully
                  data:
                    $ref: '#/components/schemas/TesterApplication'
        '400':
          description: Validation error
    get:
      summary: List all tester applications
      description: Retrieve all beta test applications. Protected by JWT.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TesterApplication'
        '401':
          description: Unauthorized
  /tester-applications/{id}:
    put:
      summary: Update a tester application
      description: Update tester details or application status (pending, approved, rejected). Protected by JWT.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                platform:
                  type: string
                  enum: [Windows, macOS, Both]
                why:
                  type: string
                country:
                  type: string
                nda:
                  type: boolean
                status:
                  type: string
                  enum: [pending, approved, rejected]
                  example: approved
      responses:
        '200':
          description: Application updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Application updated successfully
                  data:
                    $ref: '#/components/schemas/TesterApplication'
        '401':
          description: Unauthorized
        '404':
          description: Application not found
    delete:
      summary: Delete a tester application
      description: Remove an application from the database. Protected by JWT.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Application deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Application deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Application not found
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: adminuser
        email:
          type: string
          format: email
          example: admin@hiplanet.com
        createdAt:
          type: string
          format: date-time
          example: '2026-05-29T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-29T10:00:00.000Z'
    TesterApplication:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: tester@example.com
        name:
          type: string
          example: SuperPlayer
        platform:
          type: string
          example: Windows
        why:
          type: string
          example: I love roguelites!
        country:
          type: string
          example: South Korea
        nda:
          type: boolean
          example: true
        status:
          type: string
          example: pending
        createdAt:
          type: string
          format: date-time
          example: '2026-05-29T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-29T10:00:00.000Z'
